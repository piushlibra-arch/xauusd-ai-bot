[project]
name = "xauusd-ai-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piyush", email = "piushlibra@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "metatrader5>=5.0.6231 ; sys_platform == 'win32'",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
xauusd-ai-bot = "xauusd_ai_bot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
